<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Waving hand">
<style>
  text{font:26px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-anchor:middle}
  .hand{transform-box:view-box;transform-origin:27px 29px;animation:wave 3.2s ease-in-out infinite}
  @keyframes wave{0%{transform:rotate(0)}8%{transform:rotate(16deg)}16%{transform:rotate(-8deg)}24%{transform:rotate(16deg)}32%{transform:rotate(-5deg)}40%{transform:rotate(11deg)}50%,100%{transform:rotate(0)}}
  @media (prefers-reduced-motion:reduce){.hand{animation:none}}
</style>
<text class="hand" x="20" y="29">👋</text>
</svg>
